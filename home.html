<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hola profe</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --primary: #1f6feb;
      --primary-dark: #184fb8;
      --accent: #eaf2ff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #dfe7f5;
      --shadow: 0 18px 40px rgba(31, 111, 235, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #eef5ff 0%, #f8fafc 100%);
      color: var(--text);
      line-height: 1.6;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 80px 20px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: var(--accent);
      color: var(--primary-dark);
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 999px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 12px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: clamp(2.3rem, 4vw, 3.4rem);
      margin: 0 0 12px;
      color: #111827;
    }

    .subtitle {
      color: var(--muted);
      font-size: 1.08rem;
      margin: 0 0 32px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 32px 28px;
    }

    .cta {
      display: inline-block;
      margin-top: 24px;
      background: linear-gradient(135deg, var(--primary), #4d90ff);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      padding: 14px 24px;
      border-radius: 999px;
    }

    .cta:hover {
      background: var(--primary-dark);
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="badge">GitHub · Bootcamp IT</div>
    <div class="card">
      <h1>¡Hola profe!</h1>
      <p class="subtitle">
        Pude clonar el repositorio y conectar esta página con el index.html.
      </p>
      <a class="cta" href="index.html">Ir a la guía de colaboradores</a>
    </div>
  </main>
</body>
</html>
